name: Build & Release Windows Installer (Tauri 2)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Auto Version & Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Calculate & Bump Version Dynamically
        id: bump
        run: |
          node scripts/bump-version.js

      - name: Commit & Push Version Bump and Git Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .npmrc src-tauri/tauri.conf.json src-tauri/Cargo.toml
          
          # بررسی وجود تغییرات برای کامیت
          if git diff --staged --quiet; then
            echo "هیچ تغییری برای ثبت کامیت ورژن وجود ندارد."
          else
            git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
            git tag "v${{ steps.bump.outputs.new_version }}"
            git push origin HEAD --tags
          fi

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --include=optional || npm install --legacy-peer-deps --include=optional
          else
            npm install --legacy-peer-deps --include=optional
          fi
          # Fix for npm issue #4828: Force install native Windows bindings for Rolldown/Vite
          npm install --no-save @rolldown/binding-win32-x64-msvc @rollup/rollup-win32-x64-msvc --legacy-peer-deps || true

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri 2 Application & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.bump.outputs.new_version }}
          releaseName: "نسخه ویندوز دانیال استیل v${{ steps.bump.outputs.new_version }}"
          releaseBody: |
            ## 🚀 انتشار خودکار نسخه ویندوز (Tauri 2)
            
            - **نسخه جدید:** `${{ steps.bump.outputs.new_version }}`
            - **نوع ارتقا:** `${{ steps.bump.outputs.bump_type }}`
            - **سیستم‌عامل هدف:** ویندوز ۱۰ و ۱۱ (Windows 64-bit)
            - **بسته‌های نصبی:** 
              - فایل اینستالر پرتابل و سریع `NSIS (.exe)`
              - بسته سازمانی شبکه `WiX (.msi)`
            
            این نسخه به صورت خودکار توسط CI/CD گیت‌هاب پس از پوش تغییرات کامپایل و منتشر شده است.
          releaseDraft: false
          prerelease: false
          includeDebug: false

      - name: Upload Windows Installers as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DanialSteel-Windows-Installer-v${{ steps.bump.outputs.new_version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
